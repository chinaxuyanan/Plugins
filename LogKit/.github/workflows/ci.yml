name: CI

# 每次 push 与 PR 都在 GitHub 的 macOS runner 上跑一遍构建与单元测试，
# 这样改了代码不用等本机手动 swift test 就能知道有没有编译错 / 测试挂。
on:
  push:
  pull_request:

jobs:
  # 主检查：macOS 上构建 + 跑全部单元测试
  test-macos:
    name: 构建与测试（macOS）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本
        run: swift --version

      - name: 构建
        run: swift build

      - name: 单元测试
        run: swift test

  # 交叉检查：单独编一遍 iOS 目标，捕获「只写了 #if os(macOS)、漏了 iOS」这类平台专有符号泄漏
  build-ios:
    name: 编译检查（iOS）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 用 xcodebuild 编译 iOS 目标
        run: |
          xcodebuild \
            -scheme LogKit \
            -destination 'generic/platform=iOS' \
            build
